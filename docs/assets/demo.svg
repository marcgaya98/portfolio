<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%">
  <style>
    .bg { fill: #090d16; rx: 12px; stroke: #1e293b; stroke-width: 1.5px; }
    .header { fill: #0f172a; }
    .title { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; fill: #94a3b8; font-weight: 600; }
    .code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
    .prompt { fill: #38bdf8; font-weight: bold; }
    .cmd { fill: #f1f5f9; }
    .flag { fill: #c084fc; }
    .str { fill: #7dd3fc; }
    .key { fill: #34d399; }
    .comment { fill: #64748b; }
    .badge { fill: #0284c7; rx: 4px; }
    .badge-txt { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #ffffff; font-weight: bold; }
    .step1 { opacity: 0; animation: fadeIn 8s infinite 0.3s; }
    .step2 { opacity: 0; animation: fadeIn 8s infinite 1.4s; }
    .step3 { opacity: 0; animation: fadeIn 8s infinite 2.5s; }
    .step4 { opacity: 0; animation: fadeIn 8s infinite 3.8s; }
    @keyframes fadeIn {
      0%, 5% { opacity: 0; transform: translateY(3px); }
      12%, 90% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; }
    }
  </style>

  <rect class="bg" x="2" y="2" width="916" height="426" rx="12"/>
